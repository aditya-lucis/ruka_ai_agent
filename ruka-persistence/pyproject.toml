[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ruka-persistence"
version = "0.2.0"
description = "RUKA-V: The Persistent Mind - DEFINITIVE EDITION"
authors = [{ name = "Trendamis Empire" }]
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "pypdf>=6.6.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
